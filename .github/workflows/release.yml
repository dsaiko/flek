# Tag `v*` → vydání na GitHubu.
#
# Text vydání se NEGENERUJE ze seznamu commitů (hráč z něj nic nemá) — bere se
# sekce z CHANGELOG.md. Chybějící sekce nebo verze v package.json, která
# neodpovídá tagu, vydání zastaví: obojí znamená, že tag vznikl omylem.
#
# DVA JOBY, a je to schválně. Token s právem `contents: write` nesmí být na
# stejném runneru jako `npm ci`, instalace prohlížečů a `make all`. Nestačí ho
# nedat do `.git/config`: postinstall skript kterékoli závislosti může podstrčit
# vlastní `gh` a přidat si adresář do `$GITHUB_PATH`, a poslední krok by pak to
# cizí `gh` zavolal s tokenem v ruce. Jediná obrana, která tohle drží, je runner,
# na kterém se žádný kód projektu nespustí — proto se vydání odděluje.
#
#   overit  (contents: read)  — npm ci, make all, text vydání; token jen ke čtení
#   vydat   (contents: write) — čistý runner, žádné závislosti, jen `gh`
name: release

on:
  push:
    tags: ['v*']

# implicitně nic navíc: práva si každý job říká sám
permissions: {}

jobs:
  overit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      title: ${{ steps.notes.outputs.title }}
    steps:
      # `persist-credentials: false`: checkout jinak zapíše do .git/config
      # hlavičku s tokenem. Tady má sice jen právo číst, ale je to token — a
      # v jobu, kde běží postinstall skripty celého stromu závislostí, nemá co
      # dělat. Ke stažení veřejného repozitáře ho nepotřebuje nikdo.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verze v package.json musí odpovídat tagu
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          test "$want" = "$have" || {
            echo "tag $GITHUB_REF_NAME, ale package.json má $have"
            exit 1
          }

      # Přiřazení, ne `echo "title=$(…)"`: návratový kód substituce uvnitř
      # argumentu se ztratí (`echo` vrátí 0), takže chybějící sekce, prázdné
      # tělo ani řídicí znak v nadpisu by krok nezastavily — vydání by jelo dál
      # s prázdným titulkem. Přiřazení stav substituce pod `set -e` propustí.
      - name: Poznámky k vydání z CHANGELOG.md
        id: notes
        run: |
          # Ne `npx`: když by `tsx` v node_modules nenašel, STÁHL by si ho
          # z registru a spustil uvnitř release jobu. Binárka z lockfilu, ať
          # chybějící instalace vydání zastaví, místo aby tahala cizí kód.
          title="$(node node_modules/tsx/dist/cli.mjs scripts/release-notes.ts "$GITHUB_REF_NAME")"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      # chromium i webkit: smoke jede v obou (Safari chytá jiné chyby layoutu)
      - name: Prohlížeče pro smoke testy
        run: node node_modules/playwright/cli.js install --with-deps chromium webkit

      - name: make all
        env:
          # sdílený runner je pomalejší než vývojářský stroj; kontrola hlídá
          # zadrhnutý řetěz, ne absolutní výkon (viz scripts/smoke.ts)
          SMOKE_RESTART_MS: 9000
        run: make all

      # Text vydání si odnese druhý job. Jinak by ho musel vyrobit sám — a to
      # znamená `npm ci`, tedy přesně ten cizí kód, kvůli kterému se dělí.
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  vydat:
    needs: overit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ŽÁDNÝ checkout, žádné `npm ci`, žádný kód projektu. Na tomhle runneru
      # se spustí jen `gh` z image GitHubu — nemá to co podstrčit.
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      # Titulek jde přes proměnnou prostředí, ne přes `${{ }}` v těle `run:`.
      # Výraz se dosazuje do skriptu JEŠTĚ PŘED tím, než ho shell rozebere, a
      # titulek pochází z nadpisu v CHANGELOG.md (scripts/release-notes.ts bere
      # `(.*)` doslova) — uvozovka v nadpisu by tak spustila cizí příkaz s
      # GH_TOKEN a právem `contents: write`. V proměnné je to jen text.
      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
          # bez checkoutu tu není git remote, ze kterého si `gh` repozitář bere
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ needs.overit.outputs.title }}
        run: gh release create "$GITHUB_REF_NAME" --title "$RELEASE_TITLE" --notes-file release-notes.md
